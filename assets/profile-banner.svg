<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">TW — Building Ideas Into Reality</title>
  <desc id="desc">A premium midnight navy, electric blue and violet GitHub profile banner for Thu Won, Founder and Developer of A Little World With Us.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
