<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">A Little World With Us</title>
  <desc id="desc">A calm, midnight-blue and lavender banner for the A Little World With Us project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#252447"/>
      <stop offset="1" stop-color="#493b68"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".32"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1270" cy="110" r="360" fill="url(#glow)"/>
  <circle cx="1390" cy="360" r="210" fill="url(#glow)" opacity=".65"/>
  <g fill="#fff" opacity=".7">
    <circle cx="1120" cy="95" r="3"/><circle cx="1200" cy="210" r="2"/>
    <circle cx="1450" cy="120" r="3"/><circle cx="1335" cy="70" r="2"/>
    <circle cx="1510" cy="270" r="2"/><circle cx="1080" cy="360" r="2"/>
    <circle cx="1260" cy="430" r="3"/><circle cx="980" cy="180" r="2"/>
  </g>
  <g transform="translate(1120 165)" fill="none" stroke="#e9d5ff" stroke-width="5" opacity=".9">
    <path d="M0 80 C-65 25 -15 -35 35 15 C85 -35 135 25 70 80 L35 112 Z"/>
    <path d="M35 18 C35 45 35 72 35 112" opacity=".35"/>
  </g>
  <text x="110" y="210" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5">A Little World With Us</text>
  <text x="114" y="275" fill="#ddd6fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" letter-spacing="2.5">PRIVATE LIFE • SHARED MEMORIES • EVERYDAY WELLNESS</text>
  <rect x="114" y="330" width="110" height="5" rx="2.5" fill="#c4b5fd"/>
  <text x="114" y="385" fill="#e5e7eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">A thoughtful digital space for two — built with care.</text>
