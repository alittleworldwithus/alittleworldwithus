<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">A Little World With Us</title>
  <desc id="desc">A calm midnight-violet banner with the ALW logo, project name, and five subtle theme-color light trails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D20"/>
      <stop offset=".52" stop-color="#17152F"/>
      <stop offset="1" stop-color="#101B32"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="48%" r="65%">
      <stop offset="0" stop-color="#65518F" stop-opacity=".28"/>
      <stop offset="1" stop-color="#17152F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="themeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4081"/>
      <stop offset=".25" stop-color="#a855f7"/>
      <stop offset=".5" stop-color="#00d2ff"/>
      <stop offset=".75" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="logoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDA4AF"/>
      <stop offset=".55" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="logoFill" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#E11D48" stop-opacity=".92"/>
      <stop offset="1" stop-color="#4C0519"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#ambient)"/>

  <!-- Quiet celestial details -->
  <g fill="#E8E7FF" opacity=".62">
    <circle cx="115" cy="105" r="1.4"/>
    <circle cx="330" cy="70" r="1.1"/>
    <circle cx="740" cy="92" r="1.2"/>
    <circle cx="1120" cy="80" r="1.3"/>
    <circle cx="1380" cy="145" r="1.1"/>
    <circle cx="1260" cy="345" r="1.4"/>
    <circle cx="470" cy="380" r="1.1"/>
  </g>
  <circle cx="1290" cy="210" r="150" fill="#7561A8" opacity=".08" filter="url(#softGlow)"/>
  <path d="M1120 0 C1260 75 1360 62 1500 8" fill="none" stroke="#8B79BD" stroke-width="1" opacity=".12"/>

  <!-- Soft five-color aurora ribbon, kept low to preserve clear space -->
  <path d="M-40 390 C190 315 300 440 520 395 S840 345 1040 395 S1320 430 1540 335"
        fill="none" stroke="url(#themeLine)" stroke-width="34" opacity=".10" filter="url(#softGlow)"/>
  <path d="M-40 390 C190 315 300 440 520 395 S840 345 1040 395 S1320 430 1540 335"
        fill="none" stroke="url(#themeLine)" stroke-width="2.4" opacity=".72"/>
  <path d="M-30 420 C190 355 340 465 560 420 S900 380 1100 425 S1360 450 1530 390"
        fill="none" stroke="url(#themeLine)" stroke-width="1.2" opacity=".28"/>

  <!-- Logo inspired by the repository's existing assets/logo.svg -->
  <g transform="translate(225 245)">
    <circle r="108" fill="#FB7185" opacity=".12" filter="url(#softGlow)"/>
    <circle r="91" fill="none" stroke="url(#logoStroke)" stroke-width="2.2" opacity=".78"/>
    <circle r="83" fill="none" stroke="#E11D48" stroke-width="1" opacity=".34"/>
    <circle r="80" fill="url(#logoFill)"/>
    <circle r="68" fill="none" stroke="#FB7185" stroke-width="1.2" opacity=".26"/>
    <text x="0" y="10" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif"
          font-size=" thirty" font-size="30" font-weight="800" letter-spacing="2">ALW</text>
    <path d="M-28 30 H28" stroke="#FB7185" stroke-width="1.6" opacity=".62"/>
  </g>

  <path d="M365 160 V330" stroke="#C9C4E4" stroke-width="1.2" opacity=".32"/>

  <!-- Project identity -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="425" y="238" fill="#F8F7FF" font-size="64" font-weight="600" letter-spacing="1.1">A Little World</text>
    <text x="425" y="310" fill="#D9CFF2" font-size="58" font-weight="400" letter-spacing="1.2">With Us</text>
    <path d="M427 340 H590" stroke="url(#themeLine)" stroke-width="2.2" opacity=".82"/>
    <text x="425" y="382" fill="#C9C7DA" font-size="22" font-weight="400" letter-spacing="2.4">A Shared Digital Space</text>
  </g>

  <!-- Small color signature -->
  <g transform="translate(1270 105)" opacity=".72">
    <circle cx="0" cy="0" r="3.5" fill="#ff4081"/>
    <circle cx="20" cy="0" r="3.5" fill="#a855f7"/>
    <circle cx="40" cy="0" r="3.5" fill="#00d2ff"/>
    <circle cx="60" cy="0" r="3.5" fill="#34d399"/>
    <circle cx="80" cy="0" r="3.5" fill="#fbbf24"/>
  </g>
</svg>