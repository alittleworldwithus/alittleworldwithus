<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <!-- Deep Cosmic Twilight base -->
    <linearGradient id="alw_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1a"/>
      <stop offset="40%" stop-color="#190e2e"/>
      <stop offset="80%" stop-color="#241038"/>
      <stop offset="100%" stop-color="#0d0817"/>
    </linearGradient>

    <!-- 5-Color Harmonic Aurora Gradients -->
    <linearGradient id="aurora_mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" stop-opacity="0.6"/>    <!-- 1. Radiant Rose -->
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.5"/>   <!-- 2. Lavender Violet -->
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.45"/>  <!-- 3. Sky Cyan -->
      <stop offset="75%" stop-color="#34d399" stop-opacity="0.4"/>   <!-- 4. Soft Mint -->
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.5"/>  <!-- 5. Warm Gold -->
    </linearGradient>

    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#00d2ff"/>
      <stop offset="85%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <radialGradient id="world_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ff4081" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft_glow"><feGaussianBlur stdDeviation="12" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="star_glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1500" height="500" fill="url(#alw_bg)"/>

  <!-- Flowing 5-Color Aurora Mesh Ribbons in Background -->
  <path d="M -100,200 Q 300,50 700,220 T 1600,120 L 1600,500 L -100,500 Z" fill="url(#aurora_mesh)" opacity="0.35"/>
  <path d="M -100,320 Q 400,180 850,300 T 1600,240 L 1600,500 L -100,500 Z" fill="url(#aurora_mesh)" opacity="0.45"/>

  <!-- Gentle Star Particles (Warm Gold, Rose, Cyan) -->
  <g opacity="0.65" filter="url(#star_glow)">
    <circle cx="280" cy="80" r="2.5" fill="#fbbf24"/>
    <circle cx="550" cy="60" r="1.5" fill="#ff4081"/>
    <circle cx="820" cy="95" r="2" fill="#00d2ff"/>
    <circle cx="1120" cy="65" r="2.5" fill="#34d399"/>
    <circle cx="1380" cy="110" r="2" fill="#fbbf24"/>
    <circle cx="120" cy="420" r="2" fill="#ff4081"/>
    <circle cx="950" cy="440" r="2.5" fill="#34d399"/>
    <circle cx="1420" cy="380" r="1.5" fill="#00d2ff"/>
  </g>

  <!-- Left: The Dual-World Celestial Sphere & Orbiting Sanctuary -->
  <g transform="translate(195, 250)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="135" fill="url(#world_glow)" filter="url(#soft_glow)"/>

    <!-- 5-Color Orbital Ring 1 -->
    <ellipse cx="0" cy="0" rx="145" ry="55" fill="none" stroke="url(#ribbon1)" stroke-width="2.5" transform="rotate(-25)" stroke-dasharray="12 4" opacity="0.85"/>
    <!-- 5-Color Orbital Ring 2 -->
    <ellipse cx="0" cy="0" rx="145" ry="55" fill="none" stroke="url(#ribbon1)" stroke-width="2.5" transform="rotate(35)" opacity="0.85"/>

    <!-- Central Sanctuary Orb -->
    <circle cx="0" cy="0" r="75" fill="#170c2e" stroke="url(#ribbon1)" stroke-width="3.5" filter="url(#soft_glow)"/>

    <!-- Gentle Continents / Heart-World Silhouette -->
    <path d="M -30,-15 Q -10,-45 20,-20 Q 40,0 20,25 Q -10,40 -25,20 Q -40,0 -30,-15 Z" fill="#a855f7" opacity="0.35"/>
    <circle cx="18" cy="-22" r="7" fill="#fbbf24" filter="url(#star_glow)"/>
    <circle cx="-15" cy="15" r="5" fill="#00d2ff" filter="url(#star_glow)"/>

    <!-- Warm World Icon in Center -->
    <text x="0" y="16" font-family="'Segoe UI Emoji', 'Segoe UI', sans-serif" font-size="44" text-anchor="middle" filter="url(#soft_glow)">🌍</text>
  </g>

  <!-- Right: 5 Pillars of Care Harmony Constellation -->
  <g transform="translate(1120, 150)" opacity="0.85">
    <!-- Interconnecting curved arcs -->
    <path d="M 50,40 Q 150,0 240,50 Q 200,160 120,180 Q 40,140 50,40 Z" fill="none" stroke="url(#ribbon1)" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- 5 Nodes for the 5 Pillars -->
    <!-- 1. Memories (Rose) -->
    <circle cx="50" cy="40" r="16" fill="#ff4081" filter="url(#star_glow)"/>
    <text x="50" y="45" font-family="'Segoe UI Emoji', sans-serif" font-size="12" text-anchor="middle" fill="#fff">📸</text>
    
    <!-- 2. Care & Chat (Lavender) -->
    <circle cx="240" cy="50" r="16" fill="#a855f7" filter="url(#star_glow)"/>
    <text x="240" y="55" font-family="'Segoe UI Emoji', sans-serif" font-size="12" text-anchor="middle" fill="#fff">💬</text>

    <!-- 3. Learning (Cyan) -->
    <circle cx="210" cy="170" r="16" fill="#00d2ff" filter="url(#star_glow)"/>
    <text x="210" y="175" font-family="'Segoe UI Emoji', sans-serif" font-size="12" text-anchor="middle" fill="#fff">🇰🇷</text>

    <!-- 4. Wellness (Mint) -->
    <circle cx="70" cy="160" r="16" fill="#34d399" filter="url(#star_glow)"/>
    <text x="70" y="165" font-family="'Segoe UI Emoji', sans-serif" font-size="12" text-anchor="middle" fill="#fff">🌱</text>

    <!-- 5. Future (Gold) -->
    <circle cx="140" cy="105" r="22" fill="#fbbf24" filter="url(#star_glow)"/>
    <text x="140" y="112" font-family="'Segoe UI Emoji', sans-serif" font-size="15" text-anchor="middle" fill="#fff">✨</text>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(390, 155)">
    <!-- 5-Color Harmonic Badge -->
    <rect x="0" y="0" width="300" height="30" rx="15" fill="#201035" stroke="url(#ribbon1)" stroke-width="1.8"/>
    <text x="150" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fdf2f8" text-anchor="middle" letter-spacing="2">A SHARED DIGITAL SANCTUARY</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Segoe UI', 'Arial Rounded MT Bold', sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="3">A LITTLE WORLD WITH US</text>
    
    <!-- 5-Color Underline -->
    <rect x="0" y="105" width="640" height="4" rx="2" fill="url(#ribbon1)"/>

    <!-- Tagline (Warm & Meaningful) -->
    <text x="0" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#fbcfe8" letter-spacing="1">Private Space for Shared Memories, Everyday Care &amp; Meaningful Moments</text>
    
    <!-- 5 Harmonic Sub-Pills -->
    <g transform="translate(0, 185)" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      <rect x="0" y="0" width="115" height="28" rx="14" fill="#2d1030" stroke="#ff4081" stroke-width="1.5"/>
      <text x="57" y="18" fill="#fbcfe8" text-anchor="middle">MEMORIES</text>
      
      <rect x="125" y="0" width="125" height="28" rx="14" fill="#26103d" stroke="#a855f7" stroke-width="1.5"/>
      <text x="187" y="18" fill="#e9d5ff" text-anchor="middle">INTIMATE CHAT</text>

      <rect x="260" y="0" width="120" height="28" rx="14" fill="#082033" stroke="#00d2ff" stroke-width="1.5"/>
      <text x="320" y="18" fill="#bae6fd" text-anchor="middle">DAILY CARE</text>

      <rect x="390" y="0" width="135" height="28" rx="14" fill="#082b20" stroke="#34d399" stroke-width="1.5"/>
      <text x="457" y="18" fill="#a7f3d0" text-anchor="middle">KOREAN STUDY</text>

      <rect x="535" y="0" width="115" height="28" rx="14" fill="#332408" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="592" y="18" fill="#fef08a" text-anchor="middle">AI JOURNEY</text>
    </g>
  </g>
</svg>